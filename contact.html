
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20261108">
</head>

<body>


<header class="site-header">

    <h1 class="site-title">Dragon Champions</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="daily-quest.html">Daily Quest</a>
        <a href="rewards.html">Rewards</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active" aria-current="page">Contact Us</a>
    </nav>

</header>


<main class="contact-page">


    <section class="page-heading">

        <h1>Contact Us</h1>

        <p>
            Have a question or an idea for Dragon Champions?
            We'd love to hear it.
        </p>

    </section>


    <section class="contact-panel">

        <h2>Send a Message</h2>


        <form id="contact-form">


            <label for="contact-name">Your Name</label>

            <input
                    id="contact-name"
                    name="name"
                    type="text"
                    required
                    maxlength="80"
                    autocomplete="name"
            >


            <label for="contact-email">Your Email</label>

            <input
                    id="contact-email"
                    name="email"
                    type="email"
                    required
                    maxlength="120"
                    autocomplete="email"
            >


            <label for="contact-message">Your Message</label>

            <textarea
                    id="contact-message"
                    name="message"
                    rows="6"
                    required
                    maxlength="2000"
            ></textarea>


            <button type="submit" class="button">
                Send Email →
            </button>

            <p id="contact-status" role="status" aria-live="polite"></p>

        </form>

        <p class="contact-note">

        </p>

    </section>

</main>


<footer>
    <p>&copy; 2026 Dragon Champions</p>
</footer>


<script src="script.js" defer></script>

</body>
</html>
