<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quest | Dragon Champions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<nav>
        <a href="index.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="daily-quest.html" class="active" aria-current="page">Daily Quest</a>
        <a href="#">Rewards</a>
        <a href="#">Contact Us</a>
    </nav>
</header>

<main>
    <section class="page-heading">
        <h1>Daily Quests</h1>
        <p>Check off your daily goals as you complete them.</p>
    </section>

    <section class="quest-list" id="quest-list">

        <label class="quest-circle">
            <input type="checkbox">
            <h2>Study</h2>
            <p>Study for 20 minutes</p>
            <strong>+100 XP</strong>
        </label>

        <label class="quest-circle">
            <input type="checkbox">
            <h2>Clean Up</h2>
            <p>Clean and organize your space</p>
            <strong>+75 XP</strong>
        </label>

        <label class="quest-circle">
            <input type="checkbox">
            <h2>Hydrate</h2>
            <p>Remember to drink water</p>
            <strong>+50 XP</strong>
        </label>

    </section>

    <section class="panel quest-controls">
        <h2>Manage Quests</h2>
        <p>Add or remove quests from your daily list.</p>

        <div class="quest-form">
            <label for="quest-name">Quest Name</label>
            <input type="text" id="quest-name" name="quest-name"
                   placeholder="Enter a new quest" maxlength="60">

            <label for="quest-xp">XP</label>
            <input type="number" id="quest-xp" name="quest-xp"
                   value="100" min="1" max="1000" step="1">

            <button type="button" class="quest-button add-button">+ Add Quest</button>
            <button type="button" class="quest-button delete-button">− Delete Quest</button>
        </div>

        <p id="quest-message" role="status" aria-live="polite"></p>
    </section>

    <section class="panel bonus">
        <p id="xp-total" aria-live="polite">Total XP: 0</p>
        <h2>Daily Bonus</h2>
        <p>Complete all your quests to earn points.</p>
    </section>
</main>

<footer>
    <p>Contact Us | Social Media | &copy; 2026 Dragon Champions</p>
</footer>

<script src="script.js" defer></script>
</body>
</html>
